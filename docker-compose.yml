version: "3"

services:
  app:
    container_name: dev_container
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/app
      - ~/.aws:/root/.aws
      - ~/.ssh:/root/.ssh
    networks:
      - app-net
    command: /bin/sh -c "while sleep 1000; do :; done"

networks:
  app-net:
    driver: bridge
